; 焙煎記録ノート ファームウェア（SPEC 1.3 / 6章）
; プラットフォームは pioarduino（Arduino-ESP32 3.1.3）を git タグで固定する。
; ライブラリも git タグで固定する（再現性のため）。
[platformio]
default_envs = xiao_c3

[common]
platform = https://github.com/pioarduino/platform-espressif32.git#53.03.13
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
extra_scripts = pre:scripts/build_fs.py
lib_deps =
    https://github.com/mathieucarbou/AsyncTCP.git#v3.3.2
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.6.0
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
    -DTC_DRIVER_MAX31856
build_unflags = -std=gnu++11

; 本命: Seeed XIAO ESP32C3
[env:xiao_c3]
platform = ${common.platform}
framework = ${common.framework}
board = seeed_xiao_esp32c3
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBOARD_XIAO_C3 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}

; 熱電対なしで動作確認する版（SimTcDriver）
[env:xiao_c3_sim]
extends = env:xiao_c3
build_flags = ${common.build_flags} -UTC_DRIVER_MAX31856 -DTC_DRIVER_SIM -DBOARD_XIAO_C3 -DARDUINO_USB_CDC_ON_BOOT=1

; 手持ちの ESP32 DevKitC
[env:esp32dev]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBOARD_ESP32DEV
build_unflags = ${common.build_unflags}

; ESP32-C3-DevKitM-1（F3 で確認）
[env:esp32c3_devkit]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-c3-devkitm-1
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DBOARD_ESP32C3_DEVKIT -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}

; ハード無しの単体テスト（Sampler / WsProtocol / 故障の対応付け / DNS）
[env:native]
platform = https://github.com/platformio/platform-native.git
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<Sampler.cpp>
    +<CfgModel.cpp>
    +<net/WsProtocol.cpp>
    +<net/DnsReply.cpp>
    +<tc/SimTcDriver.cpp>
lib_deps = https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags = -std=gnu++17 -Wall -Isrc -Iinclude -DNATIVE_TEST

; native の WsProtocol を stdin/stdout で動かす橋（tools/test/proto/fw-bridge.mjs から使う）
[env:native_bridge]
platform = https://github.com/platformio/platform-native.git
build_src_filter =
    -<*>
    +<Sampler.cpp>
    +<CfgModel.cpp>
    +<net/WsProtocol.cpp>
    +<tc/SimTcDriver.cpp>
    +<../tools/native_bridge.cpp>
lib_deps = https://github.com/bblanchon/ArduinoJson.git#v7.4.2
build_flags = -std=gnu++17 -Wall -Isrc -Iinclude -DNATIVE_TEST
