; 焙煎記録ノート ファームウェア（SPEC 1.3 / 6章）
; プラットフォームは pioarduino（Arduino-ESP32 3.1.3）を git タグで固定する。
; ライブラリは PlatformIO レジストリの版を完全一致（@x.y.z）で固定する。
[platformio]
default_envs = xiao_c3

[common]
platform = https://github.com/pioarduino/platform-espressif32.git#53.03.13
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default.csv
monitor_speed = 115200
extra_scripts =
    pre:scripts/build_fs.py
    post:scripts/merge_bin.py
lib_deps =
    mathieucarbou/AsyncTCP@3.3.2
    mathieucarbou/ESPAsyncWebServer@3.6.0
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11

; アンプはビルドフラグで選ぶ: -DTC_DRIVER_MAX31855 / -DTC_DRIVER_MAX31856 / -DTC_DRIVER_SIM（-DTC_DRIVER_MCP9600 は F3）
; 本命: Seeed XIAO ESP32C3 + MAX31855（試作の既定アンプ）
[env:xiao_c3]
platform = ${common.platform}
framework = ${common.framework}
board = seeed_xiao_esp32c3
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DTC_DRIVER_MAX31855 -DBOARD_XIAO_C3 -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = ${common.build_unflags}

; XIAO ESP32C3 + MAX31856
[env:xiao_c3_31856]
extends = env:xiao_c3
build_flags = ${common.build_flags} -DTC_DRIVER_MAX31856 -DBOARD_XIAO_C3 -DARDUINO_USB_CDC_ON_BOOT=1

; 熱電対なしで動作確認する版（SimTcDriver）。適合試験・Wi-Fi 切り替えの確認用
[env:xiao_c3_sim]
extends = env:xiao_c3
build_flags = ${common.build_flags} -DTC_DRIVER_SIM -DBOARD_XIAO_C3 -DARDUINO_USB_CDC_ON_BOOT=1

; 手持ちの ESP32 DevKitC（アンプは MAX31855）
[env:esp32dev]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DTC_DRIVER_MAX31855 -DBOARD_ESP32DEV
build_unflags = ${common.build_unflags}

; ESP32-C3-DevKitM-1（F3 で確認）
[env:esp32c3_devkit]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-c3-devkitm-1
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DTC_DRIVER_MAX31855 -DBOARD_ESP32C3_DEVKIT
build_unflags = ${common.build_unflags}

; ハード無しの単体テスト（Sampler / WsProtocol / 故障の対応付け / DNS）
[env:native]
platform = https://github.com/platformio/platform-native.git
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<Sampler.cpp>
    +<CfgModel.cpp>
    +<net/WsProtocol.cpp>
    +<net/DnsReply.cpp>
    +<tc/SimTcDriver.cpp>
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17 -Wall -Isrc -Iinclude -DNATIVE_TEST -DUNITY_INCLUDE_DOUBLE

; native の WsProtocol を stdin/stdout で動かす橋（tools/test/proto/fw-bridge.mjs から使う）
[env:native_bridge]
platform = https://github.com/platformio/platform-native.git
build_src_filter =
    -<*>
    +<Sampler.cpp>
    +<CfgModel.cpp>
    +<net/WsProtocol.cpp>
    +<tc/SimTcDriver.cpp>
    +<../tools/native_bridge.cpp>
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17 -Wall -Isrc -Iinclude -DNATIVE_TEST -DUNITY_INCLUDE_DOUBLE
