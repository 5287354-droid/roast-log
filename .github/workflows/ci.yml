name: ci
on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: node tools/check-sync.mjs
      - name: sim サーバ適合試験
        run: |
          node tools/sim/server.mjs --speed 20 --port 8787 &
          sleep 1
          node tools/test/proto/conformance.mjs --url ws://localhost:8787/ws
